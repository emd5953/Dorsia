name: ci

on:
  push:
    branches: [build/v1, main]
  pull_request:
    branches: [build/v1, main]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare environment
        run: cp .env.example .env
      - name: Set up
        run: make setup
      - name: Run CI
        run: make ci
